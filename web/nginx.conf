server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    etag off;
    location = /healthz { default_type application/json; return 200 '{"ok":true,"backend":"firebase"}'; }
    location ~* \.(js|json|html)$ { add_header Cache-Control "no-store" always; try_files $uri =404; }
    location /api/ {
        default_type application/json;
        return 410 '{"detail":"This is the Firebase edition. Reload with Ctrl+F5 or open an incognito window; old API scripts are cached."}';
    }
    location / { try_files $uri $uri/ =404; }
}
