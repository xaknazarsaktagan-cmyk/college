server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { default_type application/json; return 200 '{"ok":true,"backend":"firebase"}'; }
    location ~* \.(js|json|html)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
