services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abit
      POSTGRES_PASSWORD: abit
      POSTGRES_DB: abit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abit -d abit"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://abit:abit@db:5432/abit
      JWT_SECRET: abit-dev-secret-change-me
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
